<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duelo de patrones · Profe</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="duelo.css"><script src="firebase-config.js"></script>
<style>
.wrap{max-width:1100px}
.menu3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin:18px 0}
.lobby{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}@media(max-width:800px){.lobby{grid-template-columns:1fr}}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.team{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 #e6dcef;animation:pop .35s both}
.team small{display:block;color:var(--mute);font-size:12px;line-height:1.2}
.duelrow{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0;font-weight:800}
.st{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #eee}.st .s{margin-left:auto;font-weight:800}
.big-ring .ring{transform:scale(1.5);transform-origin:right center}
.cmd{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
</style></head>
<body><div class="bar"></div>
<div class="hero"><div class="in"><div class="logo">🎤</div><div><h1>Duelo de patrones · Profe</h1><p>Pantalla para proyectar</p></div></div></div>
<div class="wrap" id="app"></div>
<script type="module">
import {initDb} from './db.js';
import {TR,QN,ICON,makeChallenge,photoHTML,treeHTML,esc,confetti,rankList,podiumHTML,avatar,ring,setRing} from './shared.js';
const $=s=>document.querySelector(s),app=$('#app');
const db=await initDb(),me=db.uid;
let code=localStorage.getItem('duelo_host_code')||'';
const S={state:null,pairs:{},cur:null,res:{},scores:{},answers:{}};
let subbed=false,R=null,lastKey=null;
const base=()=>'rooms/'+code;
const doneKey=()=>'duelo_done_'+code;
const doneList=()=>{try{return JSON.parse(localStorage.getItem(doneKey())||'[]');}catch(e){return[];}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pids=()=>Object.keys(S.pairs);
const nm=id=>id==='casa'?'La casa 🏠':(S.pairs[id]?.name||'?');

// ---------- sala ----------
const rndCode=()=>{const a='BCDFGHJKLMNPRSTVXZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;};
async function createRoom(){
  let c;do{c=rndCode();}while(await db.get('rooms/'+c+'/state')!=null);
  code=c;localStorage.setItem('duelo_host_code',code);
  await db.set(base(),{hostUid:me,state:'lobby',created:db.ts()});subscribe();
}
function subscribe(){
  if(subbed)return;subbed=true;
  const w=(k,f)=>db.on(base()+'/'+k,v=>{f(v);render();});
  w('state',v=>S.state=v);w('pairs',v=>S.pairs=v||{});w('cur',v=>{S.cur=v;resumeIfNeeded();});w('res',v=>S.res=v||{});w('scores',v=>S.scores=v||{});
  w('answers',v=>{S.answers=v||{};judge();});
}
function resumeIfNeeded(){ // si la profe recarga a mitad de una ronda
  const c=S.cur;if(R||!c||!c.g||!c.open)return;
  const ch=makeChallenge(c.g,c.q,code);
  R={g:c.g,q:c.q,ch,phase:c.phase||'ask',ends:Date.now()+((c.phase==='show'?c.showSec:c.dur)||60)*1000,duels:c.duels||{},closing:false,written:{}};
}

// ---------- lanzar una pregunta ----------
function curObj(extra){
  const ch=R.ch,o={g:R.g,q:R.q,title:ch.title,prompt:R.phase==='ask'&&ch.askPrompt?ch.askPrompt:ch.prompt,
    data:R.phase==='ask'&&ch.askPrompt?'{}':JSON.stringify(ch.pub),dur:ch.dur,mult:ch.mult,duels:R.duels,startedAt:db.ts(),open:true,reveal:false};
  if(ch.phase){o.phase=R.phase;o.showSec=ch.showSec;}
  return Object.assign(o,extra||{});
}
async function launch(g,q){
  const ch=makeChallenge(g,q,code),ids=shuffle(pids()),duels={};
  for(let i=0;i<ids.length;i+=2)duels['d'+i/2]={a:ids[i],b:ids[i+1]||'casa'};
  const phase=ch.phase||'ask';
  R={g,q,ch,phase,duels,closing:false,written:{},ends:Date.now()+(phase==='show'?ch.showSec:ch.dur)*1000};
  lastKey=null;
  await db.set(base()+'/cur',curObj());
  await db.set(base()+'/state','play');
}
async function toAsk(){
  if(!R||R.phase!=='show')return;
  R.phase='ask';R.ends=Date.now()+R.ch.dur*1000;
  await db.set(base()+'/cur',curObj());
}

// ---------- evaluar y cerrar ----------
function evalAll(){
  const out={};if(!R)return out;
  const ans=S.answers?.[R.g+R.q]||{};
  pids().forEach(pid=>{
    const at=Object.values(ans[pid]||{}).sort((a,b)=>(a.t||0)-(b.t||0));
    const ok=at.find(x=>x.a===R.ch.key);
    out[pid]={ok:!!ok,n:at.length,t:ok?(ok.t||0):0};});
  return out;
}
async function judge(){
  if(!R||R.closing||R.phase==='show'||S.state!=='play')return;
  const ev=evalAll(),k=R.g+R.q;
  for(const [pid,e] of Object.entries(ev)){
    if(!e.n)continue;const j=JSON.stringify(e);
    if(R.written[pid]===j)continue;R.written[pid]=j;
    await db.set(base()+'/res/'+k+'/'+pid,e);
  }
  const all=pids();
  if(all.length&&all.every(p=>ev[p]?.ok)&&!R.autoT){R.autoT=setTimeout(closeRound,1500);}
}
async function closeRound(){
  if(!R||R.closing)return;R.closing=true;clearTimeout(R.autoT);
  const k=R.g+R.q,ev=evalAll(),pts={},win={};
  Object.values(R.duels).forEach(d=>{
    const A=ev[d.a]||{ok:false};
    if(d.b==='casa'){if(A.ok){pts[d.a]=3;win[d.a]=1;}return;}
    const Bv=ev[d.b]||{ok:false};
    if(A.ok&&Bv.ok){const aw=(A.t||0)<=(Bv.t||0);pts[d.a]=aw?3:1;pts[d.b]=aw?1:3;win[aw?d.a:d.b]=1;}
    else if(A.ok){pts[d.a]=3;win[d.a]=1;}
    else if(Bv.ok){pts[d.b]=3;win[d.b]=1;}
  });
  const m=R.ch.mult,mine={};
  pids().forEach(pid=>{const e=ev[pid]||{ok:false,n:0,t:0};mine[pid]={ok:e.ok,n:e.n,t:e.t,pts:(pts[pid]||0)*m,w:!!win[pid],closed:true};});
  await Promise.all(Object.entries(mine).map(([pid,v])=>db.set(base()+'/res/'+k+'/'+pid,v)));
  const all=JSON.parse(JSON.stringify(S.res||{}));all[k]=mine;
  const tot={};pids().forEach(pid=>{tot[pid]=Object.values(all).reduce((s,r)=>s+((r[pid]&&r[pid].pts)||0),0);});
  await db.set(base()+'/scores',tot);
  if(R.q===QN-1){const d=doneList();if(!d.includes(R.g)){d.push(R.g);localStorage.setItem(doneKey(),JSON.stringify(d));}}
  await db.set(base()+'/cur',curObj({open:false,reveal:true,sol:R.ch.solText}));
}
async function backToMenu(){R=null;lastKey=null;await db.set(base()+'/cur',null);await db.set(base()+'/state','menu');}
async function endGame(){R=null;await db.set(base()+'/cur',null);await db.set(base()+'/state','end');}

// ---------- reloj local ----------
setInterval(()=>{
  if(!R||R.closing||S.state!=='play'||!S.cur?.open)return;
  const tot=R.phase==='show'?R.ch.showSec:R.ch.dur,rem=(R.ends-Date.now())/1000;
  setRing('rg',rem,tot);
  if(rem<=0){if(R.phase==='show')toAsk();else closeRound();}
},250);

// ---------- vistas ----------
const T3=['img','mem','det'];
function joinUrl(){const dir=location.pathname.replace(/[^/]*$/,'');return location.origin+dir+'duelo.html?sala='+code;}
function render(){
  if(!code){lastKey='none';app.innerHTML=`<div class="card center"><div style="font-size:64px">⚔️</div><h2 class="hd">Duelo de patrones</h2><p style="color:var(--mute)">Equipos de hasta 5 estudiantes, un celular por equipo.</p><button class="btn go" id="mk">Crear sala nueva</button></div>`;$('#mk').onclick=createRoom;return;}
  if(S.state==null){app.innerHTML='<div class="card center"><div class="dots"><span></span><span></span><span></span></div><p>Conectando…</p></div>';return;}
  const st=S.state,c=S.cur;let key=st;
  if(st==='play'&&c)key='play'+c.g+c.q+(c.phase||'')+(c.open?'o':'c');
  if(key===lastKey&&key.endsWith('o'))return updateRound();
  lastKey=key;
  if(st==='lobby')lobby();else if(st==='menu')menu();else if(st==='end')finale();
  else if(st==='play'&&c&&c.open)roundView();else if(st==='play'&&c)revealView();
}
function newRoomBtn(){return `<button class="btn ghost" id="nr">Nueva sala</button>`;}
function bindNew(){const b=$('#nr');if(b)b.onclick=()=>{if(confirm('¿Cerrar esta sala y crear otra?')){localStorage.removeItem('duelo_host_code');code='';subbed=false;location.reload();}};}
function lobby(){
  const url=joinUrl(),ids=pids();
  app.innerHTML=`<div class="lobby"><div class="card center"><h3 class="hd">Entren con este código</h3><div class="code">${esc(code)}</div>
   <img alt="QR" width="200" height="200" style="margin:8px auto;display:block;border-radius:12px" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}">
   <p style="font-size:13px;color:var(--mute);word-break:break-all">${esc(url)}</p></div>
  <div class="card"><h3 class="hd">Equipos conectados (${ids.length})</h3><div class="teams">${ids.map(id=>`<div class="team">${avatar(id,S.pairs[id].name,44)}<div><b>${esc(S.pairs[id].name)}</b><small>${esc(S.pairs[id].ms||'')}</small></div></div>`).join('')||'<i style="color:var(--mute)">Esperando equipos…</i>'}</div>
  <div class="cmd"><button class="btn go" id="go" ${ids.length?'':'disabled'}>Elegir trivia ▶</button>${newRoomBtn()}</div></div></div>`;
  $('#go').onclick=()=>db.set(base()+'/state','menu');bindNew();
}
function menu(){
  const done=doneList();
  app.innerHTML=`<h2 class="hd" style="text-align:center;font-size:30px;margin-top:10px">¿Qué trivia jugamos?</h2>
  <p style="text-align:center;color:var(--mute)">${pids().length} equipos · cada trivia tiene 3 preguntas y la última vale doble</p>
  <div class="menu3">${T3.map(g=>`<button class="tcard" data-g="${g}" style="--c:${TR[g].c}">${done.includes(g)?'<span class="dn">✔ Jugada</span>':''}${ICON[g]}<h3>${TR[g].n}</h3><p>${esc(TR[g].d)}</p></button>`).join('')}</div>
  <div class="card"><h3 class="hd" style="margin-bottom:8px">Marcador</h3>${rankList(S.pairs,S.scores,'')}</div>
  <div class="cmd"><button class="btn ghost" id="fin">🏆 Terminar y ver podio</button></div>`;
  app.querySelectorAll('.tcard').forEach(b=>b.onclick=()=>launch(b.dataset.g,0));
  $('#fin').onclick=()=>{if(confirm('¿Ir al podio final?'))endGame();};
}
function duelsHTML(){return Object.values(S.cur?.duels||{}).map(d=>`<div class="duelrow">${avatar(d.a,nm(d.a),38)}<span>${esc(nm(d.a))}</span><span style="color:#C4173F">⚡</span><span>${esc(nm(d.b))}</span>${d.b==='casa'?'<span class="av" style="width:38px;height:38px;background:#6F6468">🏠</span>':avatar(d.b,nm(d.b),38)}</div>`).join('');}
function statusHTML(){
  const k=S.cur.g+S.cur.q;
  return pids().map(id=>{const r=S.res?.[k]?.[id];const t=r?(r.ok?'✅ Correcto':(r.n?'❌ intentos: '+r.n:'…')):'…';
    return `<div class="st">${avatar(id,nm(id),30)}<span>${esc(nm(id))}</span><span class="s">${t}</span></div>`;}).join('');
}
function publicHTML(){
  const c=S.cur,d=JSON.parse(c.data||'{}');
  if(c.g==='img')return `<div style="max-width:460px;margin:auto">${photoHTML(d.target)}</div><p class="center" style="color:var(--mute)">Esta es la foto objetivo. Cada equipo la ve en su celular.</p>`;
  if(c.g==='mem')return c.phase==='show'?`<div style="max-width:520px;margin:auto">${treeHTML(d.tree,true)}</div>`:`<div class="center" style="font-size:64px">🙈</div><p class="center" style="font-size:22px;font-weight:800">${esc(c.prompt)}</p>`;
  return `<div>${(d.cases||[]).map((x,i)=>`<div class="case"><div class="em">${x.e}</div><div><b>${i+1})</b> ${esc(x.t)}</div></div>`).join('')}</div>`;
}
function roundView(){
  const c=S.cur,T=TR[c.g];
  app.innerHTML=`<div class="card" style="--c:${T.c}"><div class="rhead"><div><span class="pill">${esc(T.n)}</span><span class="pill">Pregunta ${c.q+1} de ${QN}</span>${c.mult>1?'<span class="pill x2">PUNTOS x2</span>':''}</div><div class="big-ring">${ring('rg')}</div></div>
  <p class="prompt">${esc(c.prompt)}</p>${publicHTML()}</div>
  <div class="card"><h3 class="hd">Duelos</h3>${duelsHTML()}</div>
  <div class="card"><h3 class="hd">Respuestas</h3><div id="stt">${statusHTML()}</div>
  <div class="cmd"><button class="btn ghost" id="cl">${c.phase==='show'?'Ocultar ya':'Cerrar ronda ya'}</button></div></div>`;
  $('#cl').onclick=()=>c.phase==='show'?toAsk():closeRound();
  updateRound();
}
function updateRound(){
  if(!S.cur?.open)return;const e=$('#stt');if(e)e.innerHTML=statusHTML();
  if(R){const tot=R.phase==='show'?R.ch.showSec:R.ch.dur;setRing('rg',(R.ends-Date.now())/1000,tot);}
}
function revealView(){
  const c=S.cur,k=c.g+c.q,last=c.q===QN-1,done=doneList();
  const rows=pids().map(id=>{const r=S.res?.[k]?.[id]||{};return `<div class="st">${avatar(id,nm(id),30)}<span>${esc(nm(id))}</span><span class="s">${r.w?'🏆 ':''}+${r.pts||0}</span></div>`;}).join('');
  app.innerHTML=`<div class="card" style="--c:${TR[c.g].c}"><span class="pill">${esc(TR[c.g].n)} · Pregunta ${c.q+1}</span><h3 class="hd" style="margin-top:8px">✔ Respuesta correcta</h3><p style="font-size:20px">${esc(c.sol||'')}</p></div>
  <div class="lobby"><div class="card"><h3 class="hd">Puntos de esta pregunta</h3>${rows}</div><div class="card"><h3 class="hd" style="margin-bottom:8px">Marcador</h3>${rankList(S.pairs,S.scores,'')}</div></div>
  <div class="cmd">${last?`<button class="btn go" id="nx">Volver al menú de trivias</button>`:`<button class="btn go" id="nx">Siguiente pregunta ▶</button>`}</div>`;
  $('#nx').onclick=()=>last?backToMenu():launch(c.g,c.q+1);
}
function finale(){
  app.innerHTML=`<div class="card center"><h2 class="hd" style="font-size:34px">🏆 ¡Podio final!</h2>${podiumHTML(S.pairs,S.scores)}<div class="cmd">${newRoomBtn()}</div></div>`;bindNew();confetti(120);
}

// ---------- arranque ----------
(async()=>{
  if(code){const st=await db.get(base()+'/state'),h=await db.get(base()+'/hostUid');
    if(st!=null&&h===me)subscribe();else{localStorage.removeItem('duelo_host_code');code='';}}
  render();
})();
</script></body></html>
