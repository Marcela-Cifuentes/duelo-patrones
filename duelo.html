<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duelo de patrones</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="duelo.css"><script src="firebase-config.js"></script></head>
<body><div class="bar"></div>
<div class="hero"><div class="in"><div class="logo">⚔️</div><div><h1>Duelo de patrones</h1><p>Decorator y Composite · torneo por eliminación</p></div></div></div>
<div class="wrap" id="app"></div>
<script type="module">
import {initDb} from './db.js';
import {TY,POOLBY,makeChallenge,publicHTML,esc,avatar,ring,setRing,confetti,podiumHTML} from './shared.js';
const $=s=>document.querySelector(s),app=$('#app');
const db=await initDb(),me=db.uid;
let code=(new URLSearchParams(location.search).get('sala')||localStorage.getItem('duelo_code')||'').toUpperCase();
const S={state:null,pairs:{},cur:null,scores:{}};
let lastKey=null,t0=0,getAns=()=>null,subbed=false,KEY='';
const base=()=>'rooms/'+code;
const myName=()=>S.pairs[me]?.name||'Tu equipo';
const nameOf=id=>S.pairs[id]?.name||'?';
const isOut=()=>S.scores?.[me]?.st==='out';

function joinView(err){
  app.innerHTML=`<div class="card"><h2 class="hd" style="color:var(--p)">Únanse al torneo</h2>
  <p style="color:var(--mute)">Un solo celular por equipo: el capitán escribe aquí y manda las respuestas que decidan entre todos.</p>
  <label>Código de sala</label><input class="t" id="c" maxlength="6" value="${esc(code)}" style="text-transform:uppercase;font-weight:800;letter-spacing:4px">
  <label>Nombre del equipo</label><input class="t" id="n" maxlength="30" placeholder="Ej: Los Decoradores">
  <label>Integrantes (mínimo 2, máximo 5)</label>
  ${[1,2,3,4,5].map(i=>`<input class="t m" maxlength="30" placeholder="Integrante ${i}" style="margin-bottom:6px">`).join('')}
  <div class="msg bad" id="e">${esc(err||'')}</div><button class="btn go wide" id="go">¡Entrar al torneo!</button></div>`;
  $('#go').onclick=async()=>{
    const c=$('#c').value.trim().toUpperCase(),n=$('#n').value.trim(),ms=[...document.querySelectorAll('.m')].map(x=>x.value.trim()).filter(Boolean);
    if(!c||!n||ms.length<2)return $('#e').textContent='Falta el código, el nombre del equipo y al menos 2 integrantes.';
    code=c;const st=await db.get(base()+'/state');
    if(st==null)return $('#e').textContent='No encuentro esa sala. Revisen el código.';
    await db.set(base()+'/pairs/'+me,{name:n,ms:ms.join(' · '),uid:me,at:db.ts()});
    localStorage.setItem('duelo_code',code);subscribe();
  };
}
function subscribe(){
  if(subbed)return;subbed=true;
  const w=(k,f)=>db.on(base()+'/'+k,v=>{f(v);refresh();});
  w('state',v=>S.state=v);w('pairs',v=>S.pairs=v||{});w('cur',v=>S.cur=v);w('scores',v=>S.scores=v||{});
}
function myMatch(){
  const ms=S.cur?.matches;if(!ms)return null;
  for(const [mid,m] of Object.entries(ms))if(m.a===me||m.b===me)return{mid,m};return null;
}
const vs=(a,b)=>`<div class="vsb"><div class="tm">${avatar(a,nameOf(a),56)}<span class="n">${esc(nameOf(a))}</span></div><div class="bolt">⚡</div><div class="tm">${avatar(b,nameOf(b),56)}<span class="n">${esc(nameOf(b))}</span></div></div>`;
function refresh(){
  if(!subbed||S.state==null)return;
  const st=S.state,c=S.cur;let key;
  if(st==='end')key='end';
  else if(st==='play'&&c?.matches){const mm=myMatch();
    if(mm)key=mm.m.bye?'bye'+c.key:mm.m.w?'res'+c.key+mm.mid+mm.m.w:'rd'+c.key+mm.mid+(mm.m.ch?.phase||'');
    else key='watch'+c.key+(isOut()?'o':'a')+(c.final?'f':'');}
  else key='wait'+st+(isOut()?'o':'a')+Object.keys(S.pairs).length+(c?.name||'');
  if(key!==lastKey){lastKey=key;build(key);}
}
function build(key){
  t0=Date.now();
  if(key==='end')return endView();
  if(key.startsWith('bye'))return byeView();
  if(key.startsWith('res'))return resView();
  if(key.startsWith('rd'))return roundView();
  if(key.startsWith('watch'))return watchView();
  waitView();
}
function waitView(){
  const st=S.state,out=isOut(),n=Object.keys(S.pairs).length;
  const msg=out?'<h2 class="hd" style="color:var(--r)">😢 Quedaron fuera</h2><p>Pero siguen en el salón: ¡apoyen a los que quedan!</p>'
    :st==='lobby'?'<h2 class="hd">¡Ya están dentro!</h2><p>La profe está esperando a los demás equipos…</p>'
    :'<h2 class="hd">Siguen en el torneo 💪</h2><p>La profe está armando los enfrentamientos'+(S.cur?.name?' después de <b>'+esc(S.cur.name)+'</b>':'')+'…</p>';
  app.innerHTML=`<div class="card center">${avatar(me,myName(),84)}<h2 class="hd" style="margin-top:10px">${esc(myName())}</h2><p style="color:var(--mute)">${esc(S.pairs[me]?.ms||'')}</p>
  <div class="dots" style="margin:14px 0"><span></span><span></span><span></span></div>${msg}<p style="color:var(--mute)">Sala ${esc(code)} · ${n} equipos</p></div>`;
}
function watchView(){
  const c=S.cur,out=isOut();
  app.innerHTML=`<div class="card center"><div style="font-size:60px">${c.final?'🏆':'👀'}</div><h2 class="hd">${c.final?'¡GRAN FINAL!':esc(c.name)+' en juego'}</h2>
  <p style="font-size:18px">${c.final?'Miren la pantalla del proyector: la final se juega para todos.':out?'Ya no compiten, pero pueden mirar el proyector y animar.':'Esta vez no les toca jugar. ¡Miren el proyector!'}</p></div>`;
}
function byeView(){app.innerHTML=`<div class="card center"><div style="font-size:70px;animation:bob 1.4s infinite">🎟️</div><h2 class="hd" style="color:var(--g)">¡Pasan directo!</h2><p style="font-size:18px">No les tocó rival en esta ronda. ¡Descansen un momento!</p></div>`;}
function resView(){
  const mm=myMatch(),m=mm.m,won=m.w===me,c=S.cur;
  const why=m.why==='elim'?(won?'El rival fue descalificado por la profe.':'La profe los eliminó de este duelo.'):m.why==='prof'?'La profe decidió el resultado.':m.why==='score'?'Ganó quien acertó más y más rápido.':'Ganó quien acertó primero.';
  const ser=c.final&&c.series?`<p style="font-weight:800;font-size:22px">Serie: ${esc(nameOf(c.a))} ${c.series.wa} – ${c.series.wb} ${esc(nameOf(c.b))}</p>`:'';
  app.innerHTML=`<div class="card center" style="--c:${won?'#3F7414':'#6F6468'}"><div style="font-size:70px">${won?'🏆':'😅'}</div><h2 class="hd">${won?'¡Ganaron el duelo!':'Esta vez ganó el rival'}</h2>${vs(m.a,m.b)}<p>${why}</p>${ser}
   <div style="text-align:left;margin-top:12px"><b>✔ Respuesta:</b> ${esc(makeChallenge(POOLBY[m.ch.id],code).sol)}</div></div>`;
  if(won)confetti(60);
}
function endView(){
  const c=S.cur||{},won=c.champion===me;
  app.innerHTML=`<div class="card center"><h2 class="hd" style="font-size:30px">${won?'🎉 ¡SON LOS CAMPEONES!':'🏆 ¡Terminó el torneo!'}</h2>${podiumHTML(c.champion,c.second,c.semis||[],S.pairs)}</div>`;confetti(120);
}
// ---------- ronda ----------
function roundView(){
  const mm=myMatch(),c=S.cur,m=mm.m,ch=m.ch,T=TY[ch.ty],phase=ch.phase||'',show=phase==='show';
  KEY=makeChallenge(POOLBY[ch.id],code).key;getAns=()=>null;
  const prompt=phase==='ask'?ch.ask.p:ch.p;
  app.innerHTML=`<div class="card" style="--c:${T.c}">${vs(m.a,m.b)}</div>
  <div class="card" style="--c:${T.c}"><div class="rhead"><div><span class="pill">${T.e} ${esc(T.n)}</span><span class="pill">${esc(c.name)}</span></div>${ring('rg')}</div>
  <p class="prompt">${esc(prompt)}</p><div id="work"></div>${show||ch.ty==='tf'?'':'<div class="msg" id="msg"></div><button class="btn go wide" id="send">Enviar respuesta</button>'}</div>`;
  const d=JSON.parse(ch.d||'{}'),w=$('#work');
  B[ch.ty](d,w,ch,phase,mm);
  const s=$('#send');if(s)s.onclick=()=>send(mm);
  tick();
}
const msg=(t,k)=>{const e=$('#msg');if(e){e.textContent=t;e.className='msg '+(k||'');}};
async function send(mm){
  const a=getAns();if(a==null||a==='')return msg('Les falta completar la respuesta.','bad');
  const ok=String(a)===KEY;
  await db.push(base()+'/answers/'+S.cur.key+mm.mid+'/'+me,{a:String(a),t:db.ts()});
  if(ok){msg('✅ ¡Correcto! Si fueron más rápidos que el rival, ganan.','good');$('#send').disabled=true;}
  else{msg('❌ Todavía no es. Revisen entre todos y vuelvan a intentar.','bad');const w=$('#work');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');}
}
function tick(){const c=S.cur,mm=myMatch();if(!c||!mm||!mm.m.ch||!$('#rg'))return;const ch=mm.m.ch,tot=ch.phase==='show'?ch.showSec:ch.dur;setRing('rg',tot-(Date.now()-t0)/1000,tot);}
setInterval(tick,400);
const B={
 order(d,w){
  const items=d.items,tx=id=>items.find(x=>x.id===id).t;let picks=[];
  w.innerHTML=`<div class="lab">Su orden (toquen una pieza para quitarla)</div><div class="mine" id="mine"></div><div class="lab">Piezas</div><div id="pool" style="display:flex;flex-wrap:wrap;gap:8px"></div>`;
  const draw=()=>{$('#mine').innerHTML=picks.map((id,i)=>`<button class="pbtn sel" data-r="${id}"><span class="n">${i+1}</span>${esc(tx(id))}</button>`).join('')||'<i style="color:var(--mute)">Todavía vacío…</i>';
   $('#pool').innerHTML=items.filter(x=>!picks.includes(x.id)).map(x=>`<button class="pbtn" data-a="${x.id}">${esc(x.t)}</button>`).join('');
   w.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{picks.push(b.dataset.a);draw();});
   w.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{picks=picks.filter(x=>x!==b.dataset.r);draw();});};
  draw();getAns=()=>picks.length===items.length?picks.join(','):null;
 },
 mem(d,w,ch,phase){
  if(phase==='show'){w.innerHTML=publicHTML(ch,'show');return;}
  if(ch.ask.k==='num'){
   w.innerHTML=`<div class="hide"><div class="ic">🙈</div><b>¡Se escondió!</b></div><label style="display:block;margin-top:12px"><b>Su respuesta (solo el número):</b></label><input class="t" id="num" type="number" inputmode="numeric" placeholder="Escriban un número" style="font-size:24px;text-align:center;font-weight:800">`;
   getAns=()=>{const v=$('#num').value.trim();return v===''?null:String(Number(v));};
  }else{
   let sel=null;w.innerHTML=`<div class="hide"><div class="ic">🙈</div><b>¡Se escondió!</b></div><div style="display:grid;gap:10px;margin-top:12px">${Object.values(ch.ask.opts||{}).map(o=>`<button class="pbtn" data-o="${esc(o.id)}">${esc(o.t)}</button>`).join('')}</div>`;
   w.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{sel=b.dataset.o;w.querySelectorAll('[data-o]').forEach(x=>x.classList.toggle('sel',x===b));});
   getAns=()=>sel;
  }
 },
 tf(d,w,ch,phase,mm){
  const n=d.s.length,sk='tf_'+S.cur.key+mm.mid+'_'+me;let i=+(sessionStorage.getItem(sk)||0),hist=JSON.parse(sessionStorage.getItem(sk+'h')||'[]');
  const draw=()=>{
   const dots=`<div class="dotsrow">${d.s.map((_,k)=>`<i class="${hist[k]||''} ${k===i?'cur':''}"></i>`).join('')}</div>`;
   if(i>=n){w.innerHTML=dots+`<div class="tfcard">🏁 ¡Terminaron!<br><small style="font-weight:600">Aciertos: ${hist.filter(x=>x==='ok').length} de ${n}. Esperen al rival…</small></div>`;return;}
   w.innerHTML=dots+`<div class="tfcard" id="tc">${i+1}. ${esc(d.s[i])}</div><div class="tfb"><button class="btn go" data-v="V">Verdadero</button><button class="btn no" data-v="F">Falso</button></div>`;
   w.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{
    w.querySelectorAll('[data-v]').forEach(x=>x.disabled=true);const v=b.dataset.v,ok=KEY[i]===v,k=i;
    db.push(base()+'/answers/'+S.cur.key+mm.mid+'/'+me,{a:k+':'+v,t:db.ts()});
    hist[k]=ok?'ok':'ko';$('#tc').className='tfcard '+(ok?'ok':'ko');
    setTimeout(()=>{i=k+1;sessionStorage.setItem(sk,i);sessionStorage.setItem(sk+'h',JSON.stringify(hist));draw();},650);});
  };draw();
 },
 err(d,w){
  let sel=null;w.innerHTML=`<div class="codeb">${d.lines.map((x,k)=>`<button class="cl" data-k="${k}">${esc(x)}</button>`).join('')}</div>`;
  w.querySelectorAll('.cl').forEach(b=>b.onclick=()=>{sel=b.dataset.k;w.querySelectorAll('.cl').forEach(x=>x.classList.toggle('on',x===b));});
  getAns=()=>sel;
 }};
(async()=>{
  if(code){const mine=await db.get(base()+'/pairs/'+me),st=await db.get(base()+'/state');
    if(mine&&st!=null){subscribe();return;}}
  joinView();
})();
</script></body></html>
